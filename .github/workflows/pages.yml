name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '17,47 * * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Refresh public SlendyStuffClicker download counts
        run: node ops/refresh-clicker-stats.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
