name: SlendyStuffClicker publication - awaiting owner testing

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slendystuffclicker-approved-0-5-2-9
  cancel-in-progress: false

jobs:
  publish:
    # Requires owner testing and explicit approval before publication is enabled.
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Assemble reviewed binary from publication parts
        run: node -e "require('./ops/publish-approved-clicker.cjs').assembleApprovedBinary()"
      - name: Verify approved Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Get-Item -LiteralPath 'ops/releases/0.5.2.9/SlendyStuffClicker.exe'
          if ($binary.Length -ne 1229312) { throw 'Unexpected binary size' }
          $digest = (Get-FileHash -LiteralPath $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '0382d8b7f48bec7413c477672bbcf630885ddd377e864483facd02b0efa2b304') { throw 'Unapproved binary' }
          $metadata = [Diagnostics.FileVersionInfo]::GetVersionInfo($binary.FullName)
          if ($metadata.FileVersion -ne '0.5.2.9' -or $metadata.ProductVersion -ne '0.5.2.9') { throw 'Version mismatch' }
          $assembly = [Reflection.AssemblyName]::GetAssemblyName($binary.FullName)
          if ($assembly.Version.ToString() -ne '0.5.2.9') { throw 'Assembly version mismatch' }
      - name: Verify publisher boundaries
        run: node --test ops/test-approved-clicker-release.cjs
      - name: Check release-note synchronization
        run: node --test ops/test-release-notes.cjs
      - name: Synchronize existing public release descriptions
        run: node ops/sync-clicker-release-notes.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish the versioned manual preview
        run: node ops/publish-approved-clicker.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
