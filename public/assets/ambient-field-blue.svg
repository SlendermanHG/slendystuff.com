<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1400" role="img" aria-label="Blue ambient abstract background">
  <defs>
    <radialGradient id="blueOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#62d8ff" stop-opacity=".42"/>
      <stop offset="42%" stop-color="#5f8cff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#5f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8c7bff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#8c7bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1800" height="1400" fill="#070b18"/>
  <ellipse cx="280" cy="360" rx="330" ry="270" fill="url(#blueOrb)" filter="url(#blur)"/>
  <ellipse cx="1450" cy="980" rx="440" ry="360" fill="url(#violetOrb)" filter="url(#blur)"/>
  <ellipse cx="930" cy="520" rx="260" ry="220" fill="url(#blueOrb)" opacity=".45"/>
</svg>
