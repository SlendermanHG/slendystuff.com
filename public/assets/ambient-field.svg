<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1400" role="img" aria-label="Ambient abstract background">
  <defs>
    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fb7" stop-opacity="0.78"/>
      <stop offset="38%" stop-color="#ff8fb7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff8fb7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8dd3cc" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#8dd3cc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8dd3cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCopper" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d59887" stop-opacity="0.36"/>
      <stop offset="45%" stop-color="#d59887" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d59887" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8fb7" stop-opacity="0.12"/>
      <stop offset="52%" stop-color="#ff8fb7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff8fb7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8dd3cc" stop-opacity="0"/>
      <stop offset="48%" stop-color="#8dd3cc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8dd3cc" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1800" height="1400" fill="#0b0f18"/>
  <ellipse cx="280" cy="210" rx="300" ry="220" fill="url(#orbPink)" filter="url(#blurSoft)"/>
  <ellipse cx="1310" cy="210" rx="270" ry="210" fill="url(#orbTeal)" filter="url(#blurSoft)"/>
  <ellipse cx="1120" cy="650" rx="420" ry="280" fill="url(#orbCopper)" filter="url(#blurSoft)"/>
  <ellipse cx="650" cy="1010" rx="360" ry="240" fill="url(#orbTeal)" filter="url(#blurSoft)"/>
  <ellipse cx="1530" cy="1080" rx="280" ry="210" fill="url(#orbPink)" filter="url(#blurSoft)"/>

  <g opacity="0.28">
    <path d="M0 210H900" stroke="url(#beamLeft)" stroke-width="2"/>
    <path d="M920 1080H1800" stroke="url(#beamRight)" stroke-width="2"/>
    <path d="M260 0V740" stroke="#ff8fb7" stroke-opacity="0.06" stroke-width="1"/>
    <path d="M1420 280V1400" stroke="#8dd3cc" stroke-opacity="0.05" stroke-width="1"/>
  </g>

  <g opacity="0.22">
    <circle cx="960" cy="180" r="8" fill="#fff0f4"/>
    <circle cx="1015" cy="190" r="3" fill="#fff0f4"/>
    <circle cx="336" cy="1180" r="6" fill="#fff0f4"/>
    <circle cx="1485" cy="928" r="7" fill="#fff0f4"/>
  </g>
</svg>
